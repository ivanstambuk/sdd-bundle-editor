id: RULE-SUB-MATCH
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Validate Subject Claim
description: If an expected subject is configured in the runtime policy, the
  `sub` claim MUST exact-match it.
tags:
  - validation
  - security
severity: ERROR
precedenceWithinStep: 40
ruleType: StringMatch
throwsErrorCodeId: ERR-invalid-subject
failureProjection:
  trustDecision: trusted
  keySelectionStatus: resolved
implementsReferenceIds:
  - RFC-7519
bindsToContextPropertyId: STRUCT-runtime-policy
governedByAdrIds:
  - ADR-0010-profile-governs-claim-requirements
