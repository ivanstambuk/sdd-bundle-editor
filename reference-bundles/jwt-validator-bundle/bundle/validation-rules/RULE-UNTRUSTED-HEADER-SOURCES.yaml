id: RULE-UNTRUSTED-HEADER-SOURCES
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Reject Trust-Sensitive Header Key Sources
description: The validator MUST reject trust-sensitive key-distribution headers
  such as `jku`, `jwk`, `x5u`, `x5c`, `x5t`, and `x5t#S256` unless the active
  profile explicitly opts into them.
tags:
  - validation
  - header
  - security
severity: FATAL
precedenceWithinStep: 30
ruleType: HeaderPolicy
throwsErrorCodeId: ERR-unsupported-header
failureProjection:
  trustDecision: rejected
  keySelectionStatus: not-applicable
implementsReferenceIds:
  - RFC-8725
bindsToContextPropertyId: STRUCT-runtime-policy
governedByAdrIds:
  - ADR-0007-reject-untrusted-header-key-hints
  - ADR-0008-key-resolution-fails-closed
implementationHints:
  - Model this as a STEP-2 header-policy failure, not a STEP-1 syntax failure.
