  "statement": "6.2 Authorisation Data Model For transactions specific to this Extended Service which mandate authorisation as establish subscription, a uniform authorisation data model is used. To enable such a uniform authorisation, to each transaction to be authorised an authorisation sub-resource is associated. In cases where several authorisations are needed, this sub-resource is repeated.",
