  "statement": "3.1.1 Redirect SCA Approach: Implicit Start of the Authorisation Process If the ASPSP supports the Redirect SCA Approach, the message flow within the Establishing Consent sub-service is simple. The Service Consent Request is followed by a redirection to the ASPSP SCA authorisation site. A status or content request on the created consent resource might be requested by the TPP after the session is re-redirected to the TPP\u2019s system. PSU AISP ASPSP PSU initiates an account information access via a TPP 1.",
