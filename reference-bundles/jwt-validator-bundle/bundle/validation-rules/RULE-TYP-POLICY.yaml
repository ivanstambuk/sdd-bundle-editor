id: RULE-TYP-POLICY
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: "Enforce JWT Type Policy"
description: If an expected `typ` value is configured by the profile or runtime policy, the validator MUST exact-match it and reject unexpected media types or nested-token content types.
tags: [validation, header, policy]
severity: ERROR
ruleType: HeaderPolicy
throwsErrorCodeId: ERR-type-mismatch
implementsReferenceIds:
  - RFC-8725
  - OAUTH-RFC9068
  - OIDC-CORE
bindsToContextPropertyId: STRUCT-runtime-policy
governedByAdrIds:
  - ADR-profile-governs-claim-requirements
