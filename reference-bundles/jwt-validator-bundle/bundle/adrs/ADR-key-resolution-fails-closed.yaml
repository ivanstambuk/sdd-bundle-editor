id: ADR-key-resolution-fails-closed
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Treat missing, ambiguous, or stale key resolution as fail-closed outcomes
status: accepted
createdDate: '2024-09-24T09:00:00Z'
decidedDate: '2024-09-25T14:00:00Z'
lastModifiedDate: '2024-09-25T14:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  Key resolution can fail in several ways: `kid` misses, duplicate key identifiers,
  stale cache entries, issuer mismatches, or remote fetch failures. Guessing in those
  cases would turn uncertainty into silent trust.
problem: |
  How should the validator respond when it cannot resolve one unambiguous trusted key?
assumptions:
  - Security-relevant ambiguity should never be auto-healed by guesswork.
  - Retry is acceptable only when it preserves fail-closed semantics.
decision: |
  Missing keys, ambiguous key matches, stale remote material that cannot be refreshed,
  and issuer-binding failures all resolve to rejection or indeterminate trust. The
  validator never guesses a key and never silently accepts stale uncertainty.
alternativesConsidered:
  - name: Fail closed on key-resolution uncertainty
    description: Reject or mark indeterminate whenever trusted key resolution is not crisp.
    pros:
      - Prevents accidental trust escalation.
      - Keeps cache and refresh logic subordinate to security policy.
    cons:
      - Some transient outages cause hard failures.
    isChosen: true
  - name: Best-effort acceptance
    description: Try alternate keys or stale cache entries until something verifies.
    pros:
      - Potentially fewer availability failures.
    cons:
      - Harder to reason about.
      - Risks accepting the wrong trust path.
    reasonRejected: Availability cannot outrank trust clarity in a security-focused
      reference bundle.
positiveConsequences:
  - '`kid` ambiguity and remote refresh failures have a principled outcome.'
  - Strategy-specific retry behavior remains bounded.
negativeConsequences:
  - Remote profiles intentionally prefer secure failure over graceful degradation.
relatedRuleIds:
  - RULE-KID-RESOLVE
  - RULE-KID-AMBIGUITY
relatedStrategyIds:
