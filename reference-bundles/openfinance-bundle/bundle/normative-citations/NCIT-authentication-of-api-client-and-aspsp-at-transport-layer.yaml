  "excerpt": "5 Authentication of API Client and ASPSP at transport layer The communication between an API Client and an ASPSP is always secured by using a TLS- secured connection. Client authentication is always used, i.e. a mutual authentication between the API Client and the ASPSP will be part of the setup of the TLS-secured connection. TLS version 1.2 or higher has to be used. For the choice of cipher suite selections, NIST recommendations on the cryptographical strength should be followed.",
