id: CON-kt-message-length
kind: Constraint
title: KT message length
statement: KT128 and KT256 MUST support conceptual message lengths 0 <= |M| <= 2^64 - 1 bytes.
severity: must
constraintKind: parameter
executionStatus: active
artifactClass: contract
lifecycleStatus: active
structuredValue:
  min: 0
  max: 18446744073709551615
appliesToPrimitiveIds:
  - PRIM-kt128
  - PRIM-kt256
  - PRIM-hopmac128
  - PRIM-hopmac256
appliesToOperationIds:
  - OP-kt128
  - OP-kt256
  - OP-hopmac128
  - OP-hopmac256
normativeReferenceIds:
  - RFC-9861
rationale: Makes the profile's guaranteed KT and HopMAC message-support window explicit without requiring consumers to reason about larger conceptual RFC domains.
