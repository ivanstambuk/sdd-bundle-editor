id: CON-clock-skew
kind: SecurityConstraint
title: "Strict Clock Skew (Leeway) Limits"
description: Implementations MUST place a hard, short upper bound (e.g., 5 minutes) on the clock skew `leeway_seconds` allowance for time-based claim validations to mitigate replay attack windows.
tags: [security, time]
severity: HIGH
mitigatesRiskIds: []
