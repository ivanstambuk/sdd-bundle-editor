id: STRUCT-validation-context
kind: DataStructure
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Validation Context Model
description: Resolved execution context supplied by the caller or harness for a
  specific validation run, separate from normative profile rules and caller
  policy preferences.
tags:
  - data
  - input
  - context
schemaDefinition:
  type: object
  description: Authoritative invocation context for a validation run, including current time and key material when applicable.
  additionalProperties: false
  properties:
    currentTimeEpochSeconds:
      type: integer
      minimum: 0
    selectedKeyStrategyId:
      type: string
    trustedJwks:
      type: object
      additionalProperties: false
      properties:
        keys:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
            properties:
              kty:
                type: string
              kid:
                type: string
              alg:
                type: string
            required:
              - kty
    tenantId:
      type: string
    replayStateMode:
      type: string
      enum:
        - out-of-scope
        - unchecked
        - checked
    invocationSource:
      type: string
      enum:
        - runtime
        - diagnostic
        - conformance
  required:
    - currentTimeEpochSeconds
    - invocationSource
