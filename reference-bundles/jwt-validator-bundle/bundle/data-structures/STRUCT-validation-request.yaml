id: STRUCT-validation-request
kind: DataStructure
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: JWT Validation Request
description: Request envelope for the authoritative validation operation,
  carrying the compact token input, selected profile, and runtime policy
  overrides.
tags:
  - data
  - input
  - request
composesStructureIds:
  - STRUCT-token-input
  - STRUCT-profile-invocation
  - STRUCT-runtime-policy
  - STRUCT-validation-context
schemaDefinition:
  type: object
  additionalProperties: false
  properties:
    token:
      type: string
      description: Authoritative raw token input for operations that consume a
        JWT string directly.
    invocationProfileId:
      type: string
      format: sdd-ref
      title: Invocation Profile Reference
      description: References related TokenProfile entity.
      x-sdd-refTargets:
        - TokenProfile
    runtimePolicy:
      $ref: "#/$defs/runtimePolicy"
    validationContext:
      $ref: "#/$defs/validationContext"
  required:
    - token
    - invocationProfileId
    - runtimePolicy
    - validationContext
  $defs:
    runtimePolicy:
      type: object
      description: Authoritative runtime policy values that the generated
        implementation or tests must pass into the operation under test.
      additionalProperties: false
      properties:
        expectedIssuer:
          type: string
        expectedSubject:
          type: string
        expectedAudience:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              minItems: 1
        expectedTyp:
          type: string
        allowedClockSkewSeconds:
          type: integer
          minimum: 0
        allowDiagnosticClaimsOnFailure:
          type: boolean
        allowTrustSensitiveHeaderSources:
          type: boolean
        allowedCriticalHeaders:
          type: array
          items:
            type: string
          uniqueItems: true
      required:
        - allowedClockSkewSeconds
    validationContext:
      type: object
      description: Authoritative invocation context for a validation run,
        including current time and key material when applicable.
      additionalProperties: false
      properties:
        currentTimeEpochSeconds:
          type: integer
          minimum: 0
        selectedKeyStrategyId:
          type: string
        trustedJwks:
          type: object
          additionalProperties: false
          properties:
            keys:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: true
                properties:
                  kty:
                    type: string
                  kid:
                    type: string
                  alg:
                    type: string
                required:
                  - kty
        tenantId:
          type: string
        replayStateMode:
          type: string
          enum:
            - out-of-scope
            - unchecked
            - checked
        invocationSource:
          type: string
          enum:
            - runtime
            - diagnostic
            - conformance
      required:
        - currentTimeEpochSeconds
        - invocationSource
