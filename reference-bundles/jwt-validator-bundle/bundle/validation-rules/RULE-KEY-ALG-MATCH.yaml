id: RULE-KEY-ALG-MATCH
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Algorithm and Key Type Compatibility
description: The validator MUST reject the token if the `alg` specified in the
  header or validation policy is cryptographically incompatible with the
  resolved key's `kty` (e.g., attempting an ECSDA algorithm with an RSA key).
tags:
  - validation
  - crypto
  - policy
severity: FATAL
precedenceWithinStep: 60
throwsErrorCodeId: ERR-unsupported-alg
failureProjection:
  trustDecision: rejected
  keySelectionStatus: resolved
implementsReferenceIds:
  - RFC-7515
implementsConstraintIds:
  - CON-min-key-strength
  - CON-no-none-alg
  - CON-jwks-tls
governedByAdrIds:
  - ADR-0009-algorithm-policy-is-allowlist-based
