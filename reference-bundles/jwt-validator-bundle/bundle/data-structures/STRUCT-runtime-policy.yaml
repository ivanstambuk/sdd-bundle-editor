id: STRUCT-runtime-policy
kind: DataStructure
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Runtime Policy Model
description: Runtime configuration supplied by the caller to refine how the
  active JWT profile should be evaluated for a specific execution context.
tags:
  - data
  - input
  - policy
schemaDefinition:
  type: object
  description: Authoritative runtime policy values that the generated implementation or tests must pass into the operation under test.
  additionalProperties: false
  properties:
    expectedIssuer:
      type: string
    expectedSubject:
      type: string
    expectedAudience:
      oneOf:
        - type: string
        - type: array
          items:
            type: string
          minItems: 1
    expectedTyp:
      type: string
    allowedClockSkewSeconds:
      type: integer
      minimum: 0
    allowDiagnosticClaimsOnFailure:
      type: boolean
    allowTrustSensitiveHeaderSources:
      type: boolean
    allowedCriticalHeaders:
      type: array
      items:
        type: string
      uniqueItems: true
  required:
    - allowedClockSkewSeconds
