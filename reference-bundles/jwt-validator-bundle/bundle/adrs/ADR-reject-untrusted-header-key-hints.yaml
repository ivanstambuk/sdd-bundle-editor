id: ADR-reject-untrusted-header-key-hints
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Reject trust-sensitive key-distribution hints carried in token headers
status: accepted
createdDate: '2024-09-20T09:00:00Z'
decidedDate: '2024-09-23T11:00:00Z'
lastModifiedDate: '2024-09-23T11:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  JOSE headers can carry values like `jku`, `jwk`, `x5u`, `x5c`, `x5t`, and
  `x5t#S256`. In loosely designed validators those fields can blur the line between
  signed input and trusted configuration.
problem: |
  Should the validator consume token headers that point at signing keys or supporting
  certificate material?
assumptions:
  - The reference bundle is trying to establish conservative validator defaults.
  - Most deployments can operate without trusting header-provided key hints.
decision: |
  Reject trust-sensitive key-distribution hints from token headers unless a future
  profile explicitly opts into them under additional constraints. In this bundle they
  are modeled as unsupported header sources.
alternativesConsidered:
  - name: Reject untrusted header key hints
    description: Treat header-based trust hints as unsupported by default.
    pros:
      - Keeps the trust root in configuration and profile design.
      - Aligns with the remote-JWKS and OIDC security stance.
    cons:
      - Some advanced JOSE deployments are out of scope.
    isChosen: true
  - name: Honor header-provided trust hints by default
    description: Allow tokens to suggest key URLs or certificates during validation.
    pros:
      - More flexible for dynamic ecosystems.
    cons:
      - Makes attacker-controlled input influence trust.
    reasonRejected: That flexibility is not worth the ambiguity it introduces into the
      validator's trust model.
positiveConsequences:
  - The validator has one consistent story for trust roots.
  - Negative test vectors for header misuse remain clear and reproducible.
negativeConsequences:
  - Some JOSE features stay intentionally unsupported.
relatedRuleIds:
  - RULE-UNTRUSTED-HEADER-SOURCES
  - RULE-CRIT-HEADER-POLICY
relatedReferenceIds:
  - RFC-8725
tags:
  - security
  - header
  - trust
