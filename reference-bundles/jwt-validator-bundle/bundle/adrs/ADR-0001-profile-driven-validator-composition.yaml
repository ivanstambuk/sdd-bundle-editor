adr:
  id: ADR-0001-profile-driven-validator-composition
  title: Model the validator as composable profiles, strategies, rules, and suites
  y_statement: >-
    **In the context of** The reference bundle needs to describe more than one
    validator shape. It covers a

    local static-key validator, a remote JWKS validator, and an OIDC discovery
    variant.

    The same bundle also needs to capture operations, constraints, conformance
    classes,

    suites, and fixtures without duplicating large trees of nearly identical
    entities. **facing** How do we represent validator variants and their shared
    logic without creating a

    separate bundle for every deployment mode or flattening everything into one
    giant

    profile that loses architectural boundaries? **we decided for** Composable
    profile model **and neglected** One monolithic validator profile **to
    achieve** The bundle can describe product-line style variation without
    duplication.; Traceability can point from rules, suites, and operations to
    concrete decisions. **accepting** The ontology is denser and requires more
    cross-reference discipline.; Readers need to understand inheritance and
    composition to navigate the model well. **because** Model the validator as a
    composition of:


    - token profiles for externally visible capability sets

    - key strategies for trust-source behavior

    - validation rules and steps for execution semantics

    - conformance classes and suites for executable acceptance criteria


    Profiles can inherit and narrow behavior rather than fork entire entity
    sets.
  status: accepted
  created_at: 2024-09-02T09:00:00Z
  last_modified: 2024-09-05T14:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Validator Architecture Model
  tags:
    - architecture
    - model
    - composition
  priority: high
  decision_type: technology
  decision_level: tactical
