id: RULE-AUD-MATCH
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Validate Expected Audience
description: The validator MUST reject the token if the application's required
  audience identifier is not present in the `aud` claim array.
tags:
  - validation
  - security
severity: ERROR
precedenceWithinStep: 60
throwsErrorCodeId: ERR-invalid-audience
failureProjection:
  trustDecision: trusted
  keySelectionStatus: resolved
implementsReferenceIds:
  - RFC-7519
bindsToContextPropertyId: STRUCT-runtime-policy
governedByAdrIds:
  - ADR-0010-profile-governs-claim-requirements
