id: RULE-CRIT-HEADER-POLICY
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Reject Unsupported Critical Headers
description: If the `crit` header is present, every listed extension must be
  explicitly understood and allowed by the active profile; otherwise the token
  MUST be rejected.
tags:
  - validation
  - header
  - security
severity: FATAL
precedenceWithinStep: 20
ruleType: HeaderPolicy
throwsErrorCodeId: ERR-unsupported-header
failureProjection:
  trustDecision: rejected
  keySelectionStatus: not-applicable
implementsReferenceIds:
  - RFC-7515
  - RFC-8725
implementationHints:
  - Model this as a STEP-2 header-policy failure, not a STEP-1 syntax failure.
