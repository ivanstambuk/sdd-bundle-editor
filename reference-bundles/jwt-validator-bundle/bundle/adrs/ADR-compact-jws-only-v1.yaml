id: ADR-compact-jws-only-v1
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Accept only compact signed JWT input in the initial profile family
status: accepted
createdDate: '2024-09-06T09:00:00Z'
decidedDate: '2024-09-08T10:00:00Z'
lastModifiedDate: '2024-09-08T10:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  The reference bundle targets mainstream validator implementations and conformance
  coverage for the most common deployment path. The supported input surface needs to
  stay tight enough that profiles, rules, and fixtures remain readable.
problem: |
  Which JOSE container forms should the initial JWT validator profile family accept?
assumptions:
  - Compact JWS is the dominant input shape for deployed JWT validators.
  - Supporting JWE and general JWS JSON would materially expand parser and test scope.
decision: |
  The initial profile family accepts only compact signed JWT input based on JWS compact
  serialization. JWE, general JWS JSON serialization, and nested JWT forms remain
  explicit bundle entities, but they are modeled as unsupported boundary cases.
alternativesConsidered:
  - name: Compact JWS only
    description: Restrict the supported input surface to signed compact JWT strings.
    pros:
      - Keeps the validator boundary simple and auditable.
      - Matches the dominant production use case.
      - Reduces ambiguity in conformance expectations.
    cons:
      - Excludes some valid JOSE forms from v1.
    isChosen: true
  - name: Support all JOSE serializations immediately
    description: Accept JWE, JWS JSON, nested JWT, and compact JWS from the start.
    pros:
      - Broader feature coverage.
    cons:
      - Larger parser surface.
      - More fixtures, more error branches, and more security review.
    reasonRejected: The added complexity would blur the security baseline the reference
      bundle is trying to establish.
positiveConsequences:
  - Validation rules can enforce one clear input boundary.
  - Unsupported formats can be tested explicitly as negative cases.
negativeConsequences:
  - Consumers wanting JWE or JSON serialization need additional future profiles.
