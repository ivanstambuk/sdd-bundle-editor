context:
  description: >-
    The reference bundle needs to describe more than one validator shape. It
    covers a

    local static-key validator, a remote JWKS validator, and an OIDC discovery
    variant.

    The same bundle also needs to capture operations, constraints, conformance
    classes,

    suites, and fixtures without duplicating large trees of nearly identical
    entities.


    ```mermaid

    flowchart TD
        Profile[Token Profiles] --> Strategy[Key Strategies]
        Profile --> Step[Validation Steps]
        Step --> Rule[Validation Rules]
        Profile --> Suite[Conformance Suites]
        Suite --> Vector[Test Vectors]
    ```


    ## Decision Question


    How do we represent validator variants and their shared logic without
    creating a

    separate bundle for every deployment mode or flattening everything into one
    giant

    profile that loses architectural boundaries?
  assumptions:
    - Most validator variants share the same parsing and claim-validation
      pipeline.
    - Key resolution strategy is the main point of behavioral variation.
    - Conformance should be traceable back to explicit bundle entities.
alternatives:
  - name: Composable profile model
    description: Separate reusable entities with profile inheritance and explicit
      traceability.
    pros:
      - Avoids duplication between core, remote JWKS, and OIDC variants.
      - Keeps trust strategy concerns separate from claim policy concerns.
      - Makes conformance artifacts first-class entities instead of comments.
    cons:
      - Requires more entity types and cross-links.
    estimated_cost: medium
    risk: low
  - name: One monolithic validator profile
    description: Model all behavior in a single profile with many optional branches.
    pros:
      - Fewer top-level documents.
    cons:
      - Makes capability boundaries ambiguous.
      - Encourages undocumented optional behavior.
    estimated_cost: high
    risk: medium
    rejection_rationale: It would hide the architectural differences that the
      reference bundle is meant to make explicit.
decision:
  chosen_alternative: Composable profile model
  rationale: >
    Model the validator as a composition of:


    - token profiles for externally visible capability sets

    - key strategies for trust-source behavior

    - validation rules and steps for execution semantics

    - conformance classes and suites for executable acceptance criteria


    Profiles can inherit and narrow behavior rather than fork entire entity
    sets.
  tradeoffs: >-
    The team accepts the following tradeoffs:


    - The ontology is denser and requires more cross-reference discipline.

    - Readers need to understand inheritance and composition to navigate the
    model well.
  decision_date: 2024-09-05
  confidence: high
consequences:
  positive:
    - The bundle can describe product-line style variation without duplication.
    - Traceability can point from rules, suites, and operations to concrete
      decisions.
  negative:
    - The ontology is denser and requires more cross-reference discipline.
confirmation:
  description: >-
    Implementation is confirmed by the linked bundle artifacts (PROF-JWT-CORE,
    PROF-JWT-REMOTE-JWKS, PROF-JWT-OIDC-DISCOVERY, OP-validate-jwt,
    OP-run-conformance-audit, CLASS-jwt-validator-core,
    CLASS-jwt-validator-remote-jwks, CLASS-jwt-validator-oidc-discovery,
    SUITE-core-validation, SUITE-remote-jwks, SUITE-oidc-discovery) and by
    strict JWT bundle validation.


    Validation evidence should include bundle validation plus the conformance
    suites or rules that exercise this decision boundary.
  artifact_ids:
    - PROF-JWT-CORE
    - PROF-JWT-REMOTE-JWKS
    - PROF-JWT-OIDC-DISCOVERY
