id: RULE-NBF-CHECK
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Reject Premature Tokens
description: The validator MUST reject the token if the current system time is
  strictly earlier than the `nbf` claim (accounting for allowed clock skew).
tags:
  - validation
  - time
severity: ERROR
precedenceWithinStep: 20
implementsConstraintIds:
  - CON-timing-attack
throwsErrorCodeId: ERR-premature
failureProjection:
  trustDecision: trusted
  keySelectionStatus: resolved
bindsToContextPropertyId: STRUCT-validation-context
governedByAdrIds:
  - ADR-0011-time-validation-uses-injected-clock
