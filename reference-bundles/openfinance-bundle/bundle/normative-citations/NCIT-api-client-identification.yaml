  "excerpt": "7.2 API-Client identification Accessing clients are identified based on eIDAS certificates (QWAC) in analogy to the Core XS2A Interface, but without mandating PSD2 specific attributes in the certificate. These certificates are only used for the identification of the API client. In general these certificates will not contain any scheme or service specific data. See also [oFA-OR-ADM].",
