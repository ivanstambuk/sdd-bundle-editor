adr:
  id: ADR-0012-safe-diagnostics-boundary
  title: Keep diagnostics explicit without treating unverified claims as trusted data
  y_statement: >-
    **In the context of** Operators want useful diagnostics when validation
    fails, but returning parsed claims

    as if they were trustworthy can cause downstream misuse. The bundle already
    models a

    diagnostic outcome class and a constraint on claims visibility during
    failures. **facing** How much structured detail should the validator return
    on failure? **we decided for** Structured diagnostics with a trust boundary
    **and neglected** Return parsed claims freely on failure **to achieve**
    Failure reports remain actionable.; The bundle can distinguish rejected,
    malformed, indeterminate, and diagnostic outcomes. **accepting** Some
    operators may need an explicit policy flag for deeper failure introspection.
    **because** Return structured diagnostics about steps, rules, and error
    codes, but do not treat

    unverified claims as trustworthy output unless runtime policy explicitly
    opts into a

    diagnostic-only path.
  status: accepted
  created_at: 2024-10-04T09:00:00Z
  last_modified: 2024-10-07T10:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Validation Diagnostics Contract
  tags:
    - diagnostics
    - boundary
    - trust
  priority: medium
  decision_type: security
  decision_level: tactical
