context:
  description: >-
    The bundle needs a minimal validator mode that works offline, supports
    deterministic

    tests, and avoids network trust concerns. That baseline mode becomes the
    foundation

    that richer remote profiles extend.


    ## Decision Question


    What trust source should define the smallest secure validator profile?
  assumptions:
    - A reference bundle should have one profile that is fully deterministic.
    - Static JWKS is sufficient for local integration and fixture-driven
      validation.
alternatives:
  - name: Static JWKS baseline
    description: Use caller-provided trusted key material for the core profile.
    pros:
      - Deterministic and offline-friendly.
      - Simple to explain in fixtures and examples.
      - Avoids hidden network trust assumptions.
    cons:
      - No automated key rollover.
    estimated_cost: medium
    risk: low
  - name: Remote JWKS as the default baseline
    description: Make network-based key retrieval part of the core profile.
    pros:
      - Closer to many production deployments.
    cons:
      - Pulls network and cache behavior into the smallest profile.
      - Makes tests less deterministic.
    estimated_cost: high
    risk: medium
    rejection_rationale: The baseline profile should establish security semantics
      before introducing remote dependencies.
decision:
  chosen_alternative: Static JWKS baseline
  rationale: >
    The baseline profile uses invoker-supplied static JWKS as its only trust
    source.

    Key rollover is manual, there is no cache, and network behavior is
    intentionally out

    of scope for the core profile.
  tradeoffs: |-
    The team accepts the following tradeoffs:

    - Production-like rollover is not part of the core profile.
  decision_date: 2024-09-12
  confidence: high
consequences:
  positive:
    - The core profile stays simple and reproducible.
    - Remote trust behavior can be layered on top as explicit extensions.
  negative:
    - Production-like rollover is not part of the core profile.
confirmation:
  description: >-
    Implementation is confirmed by the linked bundle artifacts (PROF-JWT-CORE,
    KEY-static-jwks) and by strict JWT bundle validation.


    Validation evidence should include bundle validation plus the conformance
    suites or rules that exercise this decision boundary.
  artifact_ids:
    - PROF-JWT-CORE
    - KEY-static-jwks
