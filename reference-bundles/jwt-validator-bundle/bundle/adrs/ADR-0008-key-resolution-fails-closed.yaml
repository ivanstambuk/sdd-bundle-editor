adr:
  id: ADR-0008-key-resolution-fails-closed
  title: Treat missing, ambiguous, or stale key resolution as fail-closed outcomes
  y_statement: >-
    **In the context of** Key resolution can fail in several ways: `kid` misses,
    duplicate key identifiers,

    stale cache entries, issuer mismatches, or remote fetch failures. Guessing
    in those

    cases would turn uncertainty into silent trust. **facing** How should the
    validator respond when it cannot resolve one unambiguous trusted key? **we
    decided for** Fail closed on key-resolution uncertainty **and neglected**
    Best-effort acceptance **to achieve** `kid` ambiguity and remote refresh
    failures have a principled outcome.; Strategy-specific retry behavior
    remains bounded. **accepting** Remote profiles intentionally prefer secure
    failure over graceful degradation. **because** Missing keys, ambiguous key
    matches, stale remote material that cannot be refreshed,

    and issuer-binding failures all resolve to rejection or indeterminate trust.
    The

    validator never guesses a key and never silently accepts stale uncertainty.
  status: accepted
  created_at: 2024-09-24T09:00:00Z
  last_modified: 2024-09-25T14:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Key Resolution Failure Semantics
  tags:
    - keys
    - trust
    - fail-closed
  priority: high
  decision_type: security
  decision_level: operational
