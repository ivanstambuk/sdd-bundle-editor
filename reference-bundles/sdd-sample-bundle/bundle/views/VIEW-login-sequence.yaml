mermaid: "```mermaid\nsequenceDiagram\n    actor user as End User\n    participant\
  \ ui as Web UI\\n(COMP-data-store)\n    participant server as Backend Server\\\
  n(COMP-api-gateway)\n    participant model as Core Model\\n(COMP-auth-service)\n\
  \n    user->>ui: Navigate to login page\n    user->>ui: Enter credentials\n   \
  \ user->>ui: Click login button\n    ui->>server: POST /auth/login\n    activate\
  \ server\n    server->>model: Validate credentials\n    activate model\n    model-->>server:\
  \ User authenticated\n    deactivate model\n    server-->>ui: 200 OK + session\
  \ token\n    deactivate server\n    ui-->>user: Display dashboard\n    Note right\
  \ of server: Session stored in memory\\nfor subsequent requests\n```"
