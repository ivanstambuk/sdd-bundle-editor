id: PROF-TURBOSHAKE-K12-RFC9861
kind: CryptoProfile
title: TurboSHAKE / KangarooTwelve / HopMAC RFC 9861 Profile
description: |
  Port of the sibling `sdd-specs` profile `sdd.crypto.xof.turboshake-kt-hopmac-rfc9861-profile`.

  The bundle captures the normative profile surface for TurboSHAKE128/256,
  KangarooTwelve KT128/KT256, HopMAC128/256, the TurboSHAKE streaming context,
  and the helper `length_encode`.
scope: |
  This profile narrows RFC 9861 for interoperable implementations. It fixes
  parameter bounds, error semantics, streaming contracts, and HopMAC policies
  while preserving the underlying TurboSHAKE and KangarooTwelve constructions.
