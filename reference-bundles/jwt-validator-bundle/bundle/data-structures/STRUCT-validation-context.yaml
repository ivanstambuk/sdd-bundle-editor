id: STRUCT-validation-context
kind: DataStructure
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Validation Context Model
description: Resolved execution context supplied by the caller or harness for a
  specific validation run, separate from normative profile rules and caller
  policy preferences.
tags:
  - data
  - input
  - context
schemaDefinition:
  type: object
  additionalProperties: false
  properties:
    currentTimeEpochSeconds:
      type: integer
      minimum: 0
    selectedKeyStrategyId:
      type: string
    tenantId:
      type: string
    replayStateMode:
      type: string
      enum:
        - out-of-scope
        - unchecked
        - checked
    invocationSource:
      type: string
      enum:
        - runtime
        - diagnostic
        - conformance
  required:
    - currentTimeEpochSeconds
    - invocationSource
