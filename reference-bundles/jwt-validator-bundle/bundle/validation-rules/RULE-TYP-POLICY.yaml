id: RULE-TYP-POLICY
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Enforce JWT Type Policy
description: If an expected `typ` value is configured by the profile or runtime
  policy, the validator MUST exact-match it and reject unexpected media types or
  nested-token content types.
tags:
  - validation
  - header
  - policy
severity: ERROR
precedenceWithinStep: 50
ruleType: HeaderPolicy
throwsErrorCodeId: ERR-type-mismatch
failureProjection:
  outcomeClass: malformed
  trustDecision: trusted
  keySelectionStatus: resolved
implementsReferenceIds:
  - RFC-8725
  - OAUTH-RFC9068
  - OIDC-CORE
bindsToContextPropertyId: STRUCT-runtime-policy
governedByAdrIds:
  - ADR-0010-profile-governs-claim-requirements
