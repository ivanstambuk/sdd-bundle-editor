id: CON-safe-diagnostics
kind: SecurityConstraint
executionStatus: active
artifactClass: support
lifecycleStatus: active
title: "Safe Diagnostics Mode"
description: Implementations MUST NOT return populated or unverified `STRUCT-claims-view` payloads on signature failure unless the runtime policy explicitly enables `allowDiagnosticClaimsOnFailure`, to prevent downstream trust manipulation.
tags: [security, boundary]
severity: CRITICAL
mitigatesRiskIds: []
