id: RULE-ISS-MATCH
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Validate Issuer Claim
description: If the expected issuer is configured in the RuntimePolicy, the iss
  claim MUST exact-match it.
rationale: Mitigates cross-tenant injection.
severity: ERROR
precedenceWithinStep: 30
ruleType: StringMatch
throwsErrorCodeId: ERR-invalid-issuer
failureProjection:
  trustDecision: trusted
  keySelectionStatus: resolved
implementsReferenceIds:
  - RFC-7519
bindsToContextPropertyId: STRUCT-runtime-policy
governedByAdrIds:
  - ADR-0010-profile-governs-claim-requirements
