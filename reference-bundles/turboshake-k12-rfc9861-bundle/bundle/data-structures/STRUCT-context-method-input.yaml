id: STRUCT-context-method-input
kind: DataStructure
title: Context Method Input
description: Generic input structure for TurboSHAKE context methods such as init, absorb, and squeeze.
structureKind: input-model
formatType: object
executionStatus: active
artifactClass: contract
lifecycleStatus: active
schemaDefinition:
  type: object
  additionalProperties: false
  properties:
    D:
      type: UInt8
      description: Domain byte accepted by `init`.
    chunk:
      type: ByteString
      description: Absorb input chunk for `absorb`.
    len:
      type: UInt64
      description: Requested output length for `squeeze`.
  methodShapes:
    - method: init
      required: [D]
    - method: absorb
      required: [chunk]
    - method: squeeze
      required: [len]
    - method: finalize
      required: []
    - method: reset
      required: []
samplePayload: |
  ```yaml
  init:
    D: 31
  absorb:
    chunk: FFFFFF
  squeeze:
    len: 64
  ```
