id: RULE-ALG-ALLOWLIST
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Enforce Algorithm Allowlist
description: The "alg" header must match one of the algorithms explicitly
  allowed by the TokenProfile. Crucially, "none" MUST be rejected unless
  explicitly allowed.
rationale: Prevents algorithm confusion attacks and bypasses via alg=none.
severity: FATAL
precedenceWithinStep: 10
ruleType: StringMatch
throwsErrorCodeId: ERR-unsupported-alg
failureProjection:
  trustDecision: rejected
  keySelectionStatus: not-applicable
implementsConstraintIds:
  - CON-timing-attack
implementsReferenceIds:
  - RFC-7518
governedByAdrIds:
  - ADR-0009-algorithm-policy-is-allowlist-based
