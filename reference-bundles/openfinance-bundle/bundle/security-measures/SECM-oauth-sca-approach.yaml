  "statement": "8.8 OAuth SCA Approach The OAuth2 protocol as used optionally for this API is defined in [RFC6749]. In this section, additional requirements on the protocol are defined. The related protocol shall be used by the TPP, if the ASPSP is transmitting the link of type \"scaOAuth\". NOTE: A more standardised security profile based on re-direct like the FAPI PAR profile are not supported yet by the openFinance API Framework.",
