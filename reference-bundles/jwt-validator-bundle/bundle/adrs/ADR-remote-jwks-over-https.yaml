id: ADR-remote-jwks-over-https
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Resolve remote keys only from explicitly configured HTTPS JWKS endpoints
status: accepted
createdDate: '2024-09-13T09:00:00Z'
decidedDate: '2024-09-16T10:00:00Z'
lastModifiedDate: '2024-09-16T10:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  Many JWT deployments rely on remote key rotation, but a reference bundle should make
  the trust boundary explicit. Remote resolution needs transport guarantees, bounded
  caching, and a clear owner for endpoint configuration.
problem: |
  How should the remote-JWKS profile acquire signing keys without allowing the token
  itself to dictate trust-sensitive network behavior?
assumptions:
  - Remote JWKS is valuable enough to model, but only under strict transport controls.
  - Endpoint selection must come from trusted configuration, not token headers.
decision: |
  Remote JWKS resolution is supported only via explicitly configured HTTPS endpoints.
  The strategy may cache and refresh, but the trust root is the configured URI plus
  validated transport, not any signer-controlled header.
alternativesConsidered:
  - name: Configured HTTPS JWKS endpoint
    description: Fetch keys from a trusted, configured HTTPS URI with bounded cache behavior.
    pros:
      - Supports real-world rollover.
      - Keeps the trust root in configuration.
      - Aligns with TLS and issuer-allowlist constraints.
    cons:
      - Introduces network failure modes and cache semantics.
    isChosen: true
  - name: Header-driven remote key endpoints
    description: Follow `jku` or similar headers directly from the token.
    pros:
      - Flexible for dynamic issuers.
    cons:
      - Trust boundary moves into attacker-controlled input.
    reasonRejected: It violates the core security stance of the bundle.
positiveConsequences:
  - The remote profile models realistic deployment behavior without blurring trust roots.
  - TLS and cache expectations become first-class artifacts.
negativeConsequences:
  - Implementations need cache, refresh, and retry behavior.
relatedProfileIds:
