id: RULE-REQUIRED-CLAIMS
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Enforce Mandatory Claims
description: The validator MUST reject tokens that fail to include claims made
  mandatory either by the active profile itself or by an enabled runtime-policy
  expectation that cannot be evaluated when the claim is absent.
tags:
  - validation
  - policy
severity: ERROR
precedenceWithinStep: 10
throwsErrorCodeId: ERR-missing-claim
failureProjection:
  trustDecision: trusted
  keySelectionStatus: resolved
implementsReferenceIds:
  - RFC-7519
parameters:
  profileRequiredClaimField: requiresClaimIds
  claimRuntimePolicyField: requiredWhenRuntimePolicyFields
governedByAdrIds:
  - ADR-0010-profile-governs-claim-requirements
implementationHints:
  - If a runtime policy expects iss, sub, or aud and that claim is absent, fail here with ERR-missing-claim before running the corresponding mismatch rule.
  - If a claim is absent, do not fall through to issuer, subject, or audience mismatch rules; this rule wins for missing-claim scenarios.
