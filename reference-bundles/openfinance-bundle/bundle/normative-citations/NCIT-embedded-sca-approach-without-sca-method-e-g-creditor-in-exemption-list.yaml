  "excerpt": "3.1.8 Embedded SCA Approach without SCA method (e.g. Creditor in Exemption List) In the following, several exemplary flows are shown, where the ASPSP has chosen to process the SCA methods through the PISP \u2013 ASPSP interface. In any case, the PSU normally will need to authenticate himself with a first factor, before any account or SCA method details will be available to the PISP. So even in case where the Payment Initiation is accepted without an SCA method due e.g. to an exemption list, the PSU is asked via the PISP to provide the PSU Identification and e.g. a password or an OTP.",
