  "statement": "8.3 Header Parameters for PSU Identification Data The openFinance API Framework supports the transmission of PSU identification data within request parameters for all Transaction Initiation Request messages. The ASPSP might mandate these elements, which then needs to be reflected in the related ASPSP documentation. Header parameters as defined in this section will not be repeated in the implementation guidelines of service specifications to enhance document readability, but the implementation guidelines will refer to this document in the relevant sections. However, the detailed specifications of service calls via the related OpenAPI files will still contain all applicable headers.",
