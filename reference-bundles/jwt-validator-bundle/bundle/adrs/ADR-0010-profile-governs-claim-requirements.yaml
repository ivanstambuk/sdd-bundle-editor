context:
  description: >-
    The core, remote-JWKS, and OIDC variants do not have identical claim
    semantics.

    For example, OIDC discovery relies more heavily on issuer binding, and
    runtime policy

    may demand audience, subject, or type checks in specific contexts.


    ## Decision Question


    Should claim presence and exact-match behavior be global validator defaults
    or part

    of profile-driven policy?
  assumptions:
    - Different deployment profiles need different claim expectations.
    - Runtime policy should narrow behavior, not replace profile semantics
      entirely.
alternatives:
  - name: Profile-driven claim policy
    description: Let profiles define the claim baseline and let runtime policy narrow it.
    pros:
      - Matches the differences between core and OIDC use cases.
      - Keeps claim semantics visible in the bundle.
    cons:
      - Requires more cross-links between profiles, rules, and context
        structures.
    estimated_cost: medium
    risk: low
  - name: One global claim policy
    description: Apply the same claim rules to all validator variants.
    pros:
      - Simpler to explain.
    cons:
      - Overconstrains some profiles and underconstrains others.
    estimated_cost: high
    risk: medium
    rejection_rationale: The variants in this bundle are materially different enough
      that a single claim policy would distort at least one of them.
decision:
  chosen_alternative: Profile-driven claim policy
  rationale: >
    Required claims, optional claims, and exact-match checks for `iss`, `aud`,
    `sub`,

    and `typ` are profile dependent. The bundle models them as explicit rules
    bound to

    runtime context and profile boundaries rather than as undocumented parser
    behavior.
  tradeoffs: >-
    The team accepts the following tradeoffs:


    - Readers need to inspect both profile and runtime policy to understand full
    behavior.
  decision_date: 2024-10-01
  confidence: high
consequences:
  positive:
    - OIDC and core semantics can coexist without hidden exceptions.
    - Claim-related conformance vectors have a clear source of truth.
  negative:
    - Readers need to inspect both profile and runtime policy to understand full
      behavior.
confirmation:
  description: >-
    Implementation is confirmed by the linked bundle artifacts (PROF-JWT-CORE,
    PROF-JWT-REMOTE-JWKS, PROF-JWT-OIDC-DISCOVERY, RULE-REQUIRED-CLAIMS,
    RULE-ISS-MATCH, RULE-AUD-MATCH, RULE-SUB-MATCH, RULE-TYP-POLICY, RFC-7519,
    OIDC-CORE) and by strict JWT bundle validation.


    Validation evidence should include bundle validation plus the conformance
    suites or rules that exercise this decision boundary.
  artifact_ids:
    - PROF-JWT-CORE
    - PROF-JWT-REMOTE-JWKS
    - PROF-JWT-OIDC-DISCOVERY
    - RULE-REQUIRED-CLAIMS
    - RULE-ISS-MATCH
    - RULE-AUD-MATCH
    - RULE-SUB-MATCH
    - RULE-TYP-POLICY
    - RFC-7519
    - OIDC-CORE
