id: CON-streaming-squeeze-length
kind: Constraint
title: Streaming squeeze length
statement: Each TurboSHAKEContext `squeeze(len)` call MUST support 0 <= len <= 2^64 - 1 bytes, and sequential squeezes must preserve the XOF prefix property.
severity: must
constraintKind: state
