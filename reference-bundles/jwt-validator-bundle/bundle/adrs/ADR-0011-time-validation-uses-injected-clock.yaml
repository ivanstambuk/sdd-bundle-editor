context:
  description: >-
    Time validation is security critical and notoriously hard to test if
    implementations

    consult wall-clock time directly. The bundle already models clock skew as a
    security

    constraint and includes boundary-focused vectors.


    ## Decision Question


    How should the validator evaluate temporal claims in a way that is both
    testable and

    operationally realistic?
  assumptions:
    - Validators need deterministic tests for exp and nbf boundaries.
    - Some bounded skew is operationally necessary in distributed systems.
alternatives:
  - name: Injected clock with bounded skew
    description: Provide a clock through validation context and apply explicit skew rules.
    pros:
      - Deterministic tests.
      - Clear operational policy.
    cons:
      - Requires clock to be part of runtime context.
    estimated_cost: medium
    risk: low
  - name: Read the system clock directly
    description: Let the validator consult local time without explicit context.
    pros:
      - Simpler implementation.
    cons:
      - Harder to test.
      - Makes clock semantics implicit.
    estimated_cost: high
    risk: medium
    rejection_rationale: Time decisions need to be observable and reproducible in a
      reference bundle.
decision:
  chosen_alternative: Injected clock with bounded skew
  rationale: >
    Evaluate temporal claims against an injected validation clock plus explicit
    skew

    policy. Boundary semantics are part of the bundle contract and are tested
    directly

    through conformance vectors.
  tradeoffs: |-
    The team accepts the following tradeoffs:

    - Callers need to provide or mock a clock in advanced scenarios.
  decision_date: 2024-10-03
  confidence: high
consequences:
  positive:
    - Boundary vectors are meaningful and stable.
    - Clock skew becomes an explicit security tradeoff instead of hidden runtime
      behavior.
  negative:
    - Callers need to provide or mock a clock in advanced scenarios.
confirmation:
  description: >-
    Implementation is confirmed by the linked bundle artifacts (RULE-EXP-CHECK,
    RULE-NBF-CHECK, RULE-TIME-BOUNDARY-CHECK, CON-clock-skew) and by strict JWT
    bundle validation.


    Validation evidence should include bundle validation plus the conformance
    suites or rules that exercise this decision boundary.
  artifact_ids:
    - RULE-EXP-CHECK
    - RULE-NBF-CHECK
    - RULE-TIME-BOUNDARY-CHECK
    - CON-clock-skew
