id: STRUCT-result-type
kind: DataStructure
title: ResultType
description: Conceptual operation result as either `Ok(payload)` or `Err(reason)`.
structureKind: output-model
formatType: tagged-union
executionStatus: active
artifactClass: contract
lifecycleStatus: active
schemaDefinition:
  okVariant: Ok
  errVariant: Err
  errPayload: ErrorCategory
  semantics:
    - Stateful methods return `Ok(updated-state)` when the transition succeeds.
    - Stateful methods return `Err(ErrorCategory)` when parameter or phase validation fails.
samplePayload: |
  ```yaml
  Ok:
    phase: SQUEEZING
  ```

  ```yaml
  Err: ERRCAT-state
  ```
