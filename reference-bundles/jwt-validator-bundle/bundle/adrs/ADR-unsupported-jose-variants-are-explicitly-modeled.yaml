id: ADR-unsupported-jose-variants-are-explicitly-modeled
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Model unsupported JOSE variants explicitly rather than omitting them
status: accepted
createdDate: '2024-10-14T09:00:00Z'
decidedDate: '2024-10-15T12:00:00Z'
lastModifiedDate: '2024-10-15T12:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: medium
deciderActorIds:
  - ACT-sec-team
context: |
  The bundle deliberately excludes several JOSE forms from the supported validator
  boundary, but that boundary is easier to understand if the excluded variants are
  still visible as modeled entities and negative vectors.
problem: |
  Should unsupported formats be absent from the bundle, or present as explicit rejected
  cases?
assumptions:
  - Seeing unsupported cases helps both implementers and auditors.
  - Explicit negative examples are valuable conformance assets.
decision: |
  Keep unsupported JOSE variants as first-class `SerializationFormat` entities with
  `supportStatus: unsupported`, and connect them to profiles and vectors that prove the
  rejection boundary.
alternativesConsidered:
  - name: Explicitly model unsupported variants
    description: Keep unsupported formats in the ontology and test them as negative cases.
    pros:
      - Makes bundle boundaries legible.
      - Supports richer conformance suites.
    cons:
      - Adds entities for things the validator does not support.
    isChosen: true
  - name: Omit unsupported formats entirely
    description: Only model supported input types.
    pros:
      - Smaller bundle.
    cons:
      - Readers must infer the unsupported surface indirectly.
    reasonRejected: Clear rejection boundaries are part of the value of this reference
      bundle.
positiveConsequences:
  - The validator boundary is explicit.
  - Negative vectors have named targets.
negativeConsequences:
  - The bundle is slightly larger than a support-only catalog.
relatedRuleIds:
  - RULE-COMPACT-JWS-ONLY
relatedFormatIds:
  - FMT-jws-compact
  - FMT-jws-json
  - FMT-jwe-compact
  - FMT-nested-jwt
tags:
  - formats
  - scope
  - boundary
