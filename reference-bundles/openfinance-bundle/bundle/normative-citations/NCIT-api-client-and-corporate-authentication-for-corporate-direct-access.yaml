  "excerpt": "2.2.1 API Client and Corporate Authentication for Corporate Direct Access If the VOP API is used in a Corporate Direct Access model, the following requirements apply on the certificate usage: \u2022 The TLS web site certificate of the API Client is either a certificate of the corporate or of an ERP cloud provider. This certificate authenticates the API Client. \u2022 If the ASPSP mandates message signing, the sealing certificate needs to be owned by the corporate to provide corporate authentication. As a minimum, the ASPSP shall accept QWACs or QSEALs certificates as defined by [eIDAS]. The ASPSP might accept other certificates in bilateral agreements with the corporate.",
