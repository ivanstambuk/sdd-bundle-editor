id: ADR-oidc-discovery-binds-issuer-to-key-source
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Use OIDC discovery only when issuer binding remains explicit
status: accepted
createdDate: '2024-09-17T09:00:00Z'
decidedDate: '2024-09-19T10:30:00Z'
lastModifiedDate: '2024-09-19T10:30:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  Some validators must resolve issuer metadata before they know the correct JWKS URI.
  OIDC discovery is a common pattern, but it is only safe if the discovered metadata
  remains bound to the issuer the caller intended to trust.
problem: |
  How do we support OIDC discovery without turning metadata lookup into an open-ended
  network traversal problem?
assumptions:
  - Discovery is useful for realistic OIDC deployments.
  - Issuer mismatch should be a terminal trust failure.
decision: |
  Support OIDC discovery as a separate profile extension. Discovery must remain issuer
  bound: the configured or expected issuer anchors metadata lookup, and mismatches
  between issuer, discovered metadata, or JWKS URI are rejected.
alternativesConsidered:
  - name: Issuer-bound discovery
    description: Discover metadata from the expected issuer and reject mismatches.
    pros:
      - Matches common OIDC deployment patterns.
      - Preserves a clear trust anchor.
    cons:
      - Adds another cache and refresh layer.
    isChosen: true
  - name: Generic metadata discovery without issuer binding
    description: Allow discovery results to define trust roots opportunistically.
    pros:
      - More flexible.
    cons:
      - Weakens the meaning of the issuer claim.
      - Makes attack analysis much harder.
    reasonRejected: The bundle treats issuer binding as a core security property, not
      an optional optimization.
positiveConsequences:
  - OIDC-specific behavior is explicit instead of leaking into the core profile.
  - Suites can target issuer mismatch and JWKS URI mismatch cases directly.
negativeConsequences:
  - The OIDC profile is more operationally complex than the core profile.
