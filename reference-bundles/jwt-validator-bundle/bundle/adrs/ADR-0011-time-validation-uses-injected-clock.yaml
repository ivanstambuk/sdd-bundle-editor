adr:
  id: ADR-0011-time-validation-uses-injected-clock
  title: Evaluate exp and nbf against an injected clock and bounded skew
  y_statement: >-
    **In the context of** Time validation is security critical and notoriously
    hard to test if implementations

    consult wall-clock time directly. The bundle already models clock skew as a
    security

    constraint and includes boundary-focused vectors. **facing** How should the
    validator evaluate temporal claims in a way that is both testable and

    operationally realistic? **we decided for** Injected clock with bounded skew
    **and neglected** Read the system clock directly **to achieve** Boundary
    vectors are meaningful and stable.; Clock skew becomes an explicit security
    tradeoff instead of hidden runtime behavior. **accepting** Callers need to
    provide or mock a clock in advanced scenarios. **because** Evaluate temporal
    claims against an injected validation clock plus explicit skew

    policy. Boundary semantics are part of the bundle contract and are tested
    directly

    through conformance vectors.
  status: accepted
  created_at: 2024-10-02T09:00:00Z
  last_modified: 2024-10-03T11:30:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Temporal Validation Semantics
  tags:
    - time
    - exp
    - nbf
  priority: medium
  decision_type: technology
  decision_level: operational
