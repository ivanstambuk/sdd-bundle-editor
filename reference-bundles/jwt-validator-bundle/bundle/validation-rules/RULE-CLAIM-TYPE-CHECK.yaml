id: RULE-CLAIM-TYPE-CHECK
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Enforce Strict Claim Types
description: The validator MUST reject tokens that provide claims in the wrong
  primitive JSON types compared to standard (e.g., numeric time claims
  incorrectly passed as strings).
tags:
  - validation
  - parse
severity: ERROR
precedenceWithinStep: 20
throwsErrorCodeId: ERR-type-mismatch
failureProjection:
  outcomeClass: malformed
  trustDecision: trusted
  keySelectionStatus: resolved
implementsReferenceIds:
  - RFC-7519
