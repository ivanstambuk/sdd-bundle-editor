adr:
  id: ADR-0014-conformance-is-executable
  title: Represent conformance as executable classes, suites, vectors, and fixtures
  y_statement: >-
    **In the context of** A validator bundle is much more useful if acceptance
    criteria can be executed rather

    than merely described. The JWT reference bundle already contains classes,
    suites,

    vectors, mock key sets, and an audit operation. **facing** How should the
    bundle express what it means for an implementation to conform? **we decided
    for** Executable conformance artifacts **and neglected** Narrative
    compliance checklist **to achieve** Acceptance criteria can evolve alongside
    rules and profiles.; Security regressions become easier to catch with
    concrete vectors. **accepting** Fixtures and suites require ongoing
    curation. **because** Model conformance as first-class executable artifacts:
    classes declare capability

    boundaries, suites group vectors and fixtures, and the audit operation
    produces a

    structured report. This keeps validation behavior and acceptance behavior in
    the same

    ontology.
  status: accepted
  created_at: 2024-10-10T09:00:00Z
  last_modified: 2024-10-11T10:30:00Z
