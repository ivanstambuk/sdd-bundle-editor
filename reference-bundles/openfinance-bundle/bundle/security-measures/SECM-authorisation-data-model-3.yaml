  "statement": "7.2 Authorisation Data Model For transactions specific to this extended service which mandate authorisation, a uniform authorisation data model is used. To enable such a uniform authorisation, to each transaction to be authorised an authorisation sub-resource is associated. In cases where several authorisations are needed, this sub-resource is repeated. The related data model and specific authorisation related messaging is not described here.",
