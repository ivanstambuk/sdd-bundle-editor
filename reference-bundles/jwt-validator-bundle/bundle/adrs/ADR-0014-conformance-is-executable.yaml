context:
  description: >-
    A validator bundle is much more useful if acceptance criteria can be
    executed rather

    than merely described. The JWT reference bundle already contains classes,
    suites,

    vectors, mock key sets, and an audit operation.


    ```mermaid

    flowchart TD
        Class[Conformance Class] --> Suite[Conformance Suite]
        Suite --> Vector[Test Vector]
        Suite --> Fixture[Mock Key Set]
        Vector --> Audit[Audit Operation]
    ```


    ## Decision Question


    How should the bundle express what it means for an implementation to
    conform?
  assumptions:
    - Conformance needs to be reproducible, not just documented.
    - Variants like remote JWKS and OIDC require different executable evidence.
alternatives:
  - name: Executable conformance artifacts
    description: Put classes, suites, vectors, fixtures, and audit reports in the bundle.
    pros:
      - Conformance can be automated.
      - Profile-specific expectations remain explicit.
    cons:
      - The bundle contains more than pure domain rules.
    estimated_cost: medium
    risk: low
  - name: Narrative compliance checklist
    description: Describe conformance in prose or markdown only.
    pros:
      - Less modeling overhead.
    cons:
      - Harder to automate and keep current.
    estimated_cost: high
    risk: medium
    rejection_rationale: The reference bundle is most valuable when it can drive
      real automated audits.
decision:
  chosen_alternative: Executable conformance artifacts
  rationale: >
    Model conformance as first-class executable artifacts: classes declare
    capability

    boundaries, suites group vectors and fixtures, and the audit operation
    produces a

    structured report. This keeps validation behavior and acceptance behavior in
    the same

    ontology.
  tradeoffs: |-
    The team accepts the following tradeoffs:

    - Fixtures and suites require ongoing curation.
  decision_date: 2024-10-11
  confidence: high
consequences:
  positive:
    - Acceptance criteria can evolve alongside rules and profiles.
    - Security regressions become easier to catch with concrete vectors.
  negative:
    - Fixtures and suites require ongoing curation.
confirmation:
  description: >-
    Implementation is confirmed by the linked bundle artifacts
    (OP-run-conformance-audit, CLASS-jwt-validator-core,
    CLASS-jwt-validator-remote-jwks, CLASS-jwt-validator-oidc-discovery,
    SUITE-core-validation, SUITE-remote-jwks, SUITE-oidc-discovery) and by
    strict JWT bundle validation.


    Validation evidence should include bundle validation plus the conformance
    suites or rules that exercise this decision boundary.
  artifact_ids:
    - OP-run-conformance-audit
    - CLASS-jwt-validator-core
    - CLASS-jwt-validator-remote-jwks
    - CLASS-jwt-validator-oidc-discovery
    - SUITE-core-validation
    - SUITE-remote-jwks
    - SUITE-oidc-discovery
