  "excerpt": "1.1 From Core XS2A Interface to openFinance API With [PSD2] the European Union has published a directive on payment services in the internal market. Among others [PSD2] contains regulations on services to be operated by so called Third Party Payment Service Providers (TPP) on behalf of a Payment Service User (PSU). These services are \u2022 Payment Initiation Service (PIS) to be operated by a Payment Initiation Service Provider (PISP) TPP as defined by article 66 of [PSD2], \u2022 Account Information Service (AIS) to be operated by an Account Information Service Provider (AISP) TPP as defined by article",
