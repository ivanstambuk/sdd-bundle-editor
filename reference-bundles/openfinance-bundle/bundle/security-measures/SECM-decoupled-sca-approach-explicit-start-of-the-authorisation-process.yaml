  "statement": "3.1.3 Decoupled SCA Approach: Explicit Start of the Authorisation Process The transaction flow in the Decoupled SCA Approach is similar to the Redirect SCA Approach. The difference is that the ASPSP is asking the PSU to authorise the account access consent e.g. via a dedicated mobile app. The ASPSP is asking the TPP to inform the PSU about this authentication by sending a corresponding PSU Message like \"Please use your xxx App to authorise the account access\". Consent API Establish Consents Messages After the SCA between ASPSP and PSU, the TPP then needs to ask for the result of the transaction.",
