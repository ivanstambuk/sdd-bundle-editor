  "excerpt": "3.1.4 Embedded SCA Approach with only one SCA method available In the following, several exemplary flows are shown, where the ASPSP has chosen to process the SCA methods for the consent approval through the PISP \u2013 ASPSP interface. In any case, the PSU normally will need to authenticate himself with a first factor, before any account or SCA method details will be available to the PISP. Remark: In case where OAuth2 is requested by the ASPSP as a pre-step to replace the PSU- and password by an access token, the sequence of the PSU authentication Consent API Establish Consents Messages with the first authentication factor is omitted. This applies for all examples for the Embedded SCA Approach.",
