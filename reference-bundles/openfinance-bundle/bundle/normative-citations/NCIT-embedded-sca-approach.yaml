  "excerpt": "8.5 Embedded SCA Approach The Embedded SCA Approach is defined as the scenario where all PSU credentials are transmitted via the XS2A API resp. the openFinance API. PSU identification data are transported using the related header parameters as defined in Section 8.3. After a Transaction Initiation Request and Response, an authorisation sub-resource is either implicitly generated by the ASPSP or needs to be explicitly created by the API Client in a next step, cp. Section 9.1.",
