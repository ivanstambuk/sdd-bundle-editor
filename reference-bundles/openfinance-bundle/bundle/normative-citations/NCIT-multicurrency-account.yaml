  "excerpt": "2.2 Multicurrency Accounts Specifics for Compliance Services The concept of a multicurrency account is introduced in [oFA PFSM]. Remark: The multi-currency account product is in use in some markets in Europe, e.g. in Online-Banking products within the Belgium market. The support of this functionality in the XS2A API is only applicable in these markets. openFinance PSD2 XSZA API \u2013 Implementation Guidelines Application Layer: Guiding Principles",
