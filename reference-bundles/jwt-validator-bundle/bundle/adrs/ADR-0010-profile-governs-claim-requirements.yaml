adr:
  id: ADR-0010-profile-governs-claim-requirements
  title: Make claim requirements and claim-matching policy profile dependent
  y_statement: >-
    **In the context of** The core, remote-JWKS, and OIDC variants do not have
    identical claim semantics.

    For example, OIDC discovery relies more heavily on issuer binding, and
    runtime policy

    may demand audience, subject, or type checks in specific contexts.
    **facing** Should claim presence and exact-match behavior be global
    validator defaults or part

    of profile-driven policy? **we decided for** Profile-driven claim policy
    **and neglected** One global claim policy **to achieve** OIDC and core
    semantics can coexist without hidden exceptions.; Claim-related conformance
    vectors have a clear source of truth. **accepting** Readers need to inspect
    both profile and runtime policy to understand full behavior. **because**
    Required claims, optional claims, and exact-match checks for `iss`, `aud`,
    `sub`,

    and `typ` are profile dependent. The bundle models them as explicit rules
    bound to

    runtime context and profile boundaries rather than as undocumented parser
    behavior.
  status: accepted
  created_at: 2024-09-30T09:00:00Z
  last_modified: 2024-10-01T13:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Claim Policy Modeling
  tags:
    - claims
    - profile
    - policy
  priority: medium
  decision_type: technology
  decision_level: tactical
