id: FEAT-demo-basic
title: Core Bundle Visualization
description: >
  This feature enables users to **browse and visualize** SDD bundles with full
  entity navigation support.


  ## Capabilities


  - **Entity Navigator**: Tree view of all entity types

  - **Details Panel**: Shows entity properties and relationships

  - **Dependency Graph**: Visual representation of entity connections


  ### Supported Entity Types


  | Type | Description |

  |------|-------------|

  | Feature | High-level capabilities |

  | Requirement | Testable specifications |

  | Component | System building blocks |


  ```yaml

  # Example entity reference

  realizesFeatureIds:
    - FEAT-demo-basic
  ```


  > **Pro tip**: Use the keyboard shortcut `Cmd+K` to search entities.
