  "kind": "other",
  "statement": "3.1.7 Decoupled SCA Approach: Implicit Start of the Authorisation Process The transaction flow in the Decoupled SCA Approach is similar to the Redirect SCA Approach. The difference is that the ASPSP is asking the PSU to authorise the payment e.g. via a dedicated mobile app, or any other application or device which is independent from the online banking frontend. The ASPSP is asking the TPP to inform the PSU about this authentication by sending a corresponding PSU Message like \"Please use your xxx App to authorise the payment\". After the SCA having been processed between ASPSP and PSU, the TPP then needs to ask for the result of the transaction.",
