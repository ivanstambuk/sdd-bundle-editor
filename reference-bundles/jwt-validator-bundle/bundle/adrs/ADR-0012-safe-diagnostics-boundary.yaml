context:
  description: >-
    Operators want useful diagnostics when validation fails, but returning
    parsed claims

    as if they were trustworthy can cause downstream misuse. The bundle already
    models a

    diagnostic outcome class and a constraint on claims visibility during
    failures.


    ## Decision Question


    How much structured detail should the validator return on failure?
  assumptions:
    - Consumers benefit from structured diagnostics.
    - Claims extracted from failed tokens are not trustworthy by default.
alternatives:
  - name: Structured diagnostics with a trust boundary
    description: Keep failure reporting rich while preserving trust semantics.
    pros:
      - Useful for debugging and conformance.
      - Avoids accidental trust escalation.
    cons:
      - Requires consumers to understand diagnostic vs trusted outcomes.
    estimated_cost: medium
    risk: low
  - name: Return parsed claims freely on failure
    description: Always include whatever claims could be parsed.
    pros:
      - Easier debugging.
    cons:
      - Risks downstream misuse of untrusted data.
    estimated_cost: high
    risk: medium
    rejection_rationale: It blurs the most important security boundary in the validator.
decision:
  chosen_alternative: Structured diagnostics with a trust boundary
  rationale: >
    Return structured diagnostics about steps, rules, and error codes, but do
    not treat

    unverified claims as trustworthy output unless runtime policy explicitly
    opts into a

    diagnostic-only path.
  tradeoffs: >-
    The team accepts the following tradeoffs:


    - Some operators may need an explicit policy flag for deeper failure
    introspection.
  decision_date: 2024-10-07
  confidence: high
consequences:
  positive:
    - Failure reports remain actionable.
    - The bundle can distinguish rejected, malformed, indeterminate, and
      diagnostic outcomes.
  negative:
    - Some operators may need an explicit policy flag for deeper failure
      introspection.
confirmation:
  description: >-
    Implementation is confirmed by the linked bundle artifacts
    (RULE-COMPACT-JWS-ONLY, CON-safe-diagnostics, STRUCT-validation-result) and
    by strict JWT bundle validation.


    Validation evidence should include bundle validation plus the conformance
    suites or rules that exercise this decision boundary.
  artifact_ids:
    - RULE-COMPACT-JWS-ONLY
    - CON-safe-diagnostics
    - STRUCT-validation-result
