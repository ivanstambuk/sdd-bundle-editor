adr:
  id: ADR-0009-algorithm-policy-is-allowlist-based
  title: Enforce explicit algorithm allowlists and key compatibility checks
  y_statement: >-
    **In the context of** JWT validation failures often come from treating
    algorithm identifiers as advisory

    rather than policy. The bundle already includes algorithm entities,
    minimum-strength

    constraints, and a prohibition on `none`. **facing** How should the
    validator decide whether an advertised algorithm is acceptable? **we decided
    for** Explicit allowlist with compatibility checks **and neglected** Accept
    any algorithm supported by the runtime library **to achieve** Crypto policy
    is visible in profiles and rules.; Weak keys and `none` are rejected for
    principled reasons. **accepting** Algorithm onboarding requires schema and
    fixture updates. **because** Algorithm policy is allowlist based. Profiles
    declare acceptable algorithms, `none`

    remains forbidden, key-algorithm compatibility is checked explicitly, and
    weak key

    material remains rejectable even if it technically verifies.
  status: accepted
  created_at: 2024-09-26T09:00:00Z
  last_modified: 2024-09-27T15:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Algorithm Policy Enforcement
