id: ADR-static-jwks-as-baseline-trust-source
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Use invoker-supplied static JWKS as the baseline trust source
status: accepted
createdDate: '2024-09-11T09:00:00Z'
decidedDate: '2024-09-12T11:00:00Z'
lastModifiedDate: '2024-09-12T11:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  The bundle needs a minimal validator mode that works offline, supports deterministic
  tests, and avoids network trust concerns. That baseline mode becomes the foundation
  that richer remote profiles extend.
problem: |
  What trust source should define the smallest secure validator profile?
assumptions:
  - A reference bundle should have one profile that is fully deterministic.
  - Static JWKS is sufficient for local integration and fixture-driven validation.
decision: |
  The baseline profile uses invoker-supplied static JWKS as its only trust source.
  Key rollover is manual, there is no cache, and network behavior is intentionally out
  of scope for the core profile.
alternativesConsidered:
  - name: Static JWKS baseline
    description: Use caller-provided trusted key material for the core profile.
    pros:
      - Deterministic and offline-friendly.
      - Simple to explain in fixtures and examples.
      - Avoids hidden network trust assumptions.
    cons:
      - No automated key rollover.
    isChosen: true
  - name: Remote JWKS as the default baseline
    description: Make network-based key retrieval part of the core profile.
    pros:
      - Closer to many production deployments.
    cons:
      - Pulls network and cache behavior into the smallest profile.
      - Makes tests less deterministic.
    reasonRejected: The baseline profile should establish security semantics before
      introducing remote dependencies.
positiveConsequences:
  - The core profile stays simple and reproducible.
  - Remote trust behavior can be layered on top as explicit extensions.
negativeConsequences:
  - Production-like rollover is not part of the core profile.
relatedProfileIds:
  - PROF-JWT-CORE
relatedStrategyIds:
