  "excerpt": "6.15 Decision about strong customer authentication The ASPSP has to decide \u2022 if SCA has to be executed as part of a payment transaction at the openFinance API interface for this extended service, \u2022 which method and personalised credentials have to be used for SCA, where the PSU will be involved in a selection process if several SCA procedures are available, and \u2022 which approach has to be used for executing SCA, taking into account the redirection preference of the TPP. The TPP has to follow the decision of the ASPSP.",
