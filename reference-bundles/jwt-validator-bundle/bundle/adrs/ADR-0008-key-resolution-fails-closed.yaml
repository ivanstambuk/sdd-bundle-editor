context:
  description: >-
    Key resolution can fail in several ways: `kid` misses, duplicate key
    identifiers,

    stale cache entries, issuer mismatches, or remote fetch failures. Guessing
    in those

    cases would turn uncertainty into silent trust.


    ## Decision Question


    How should the validator respond when it cannot resolve one unambiguous
    trusted key?
  assumptions:
    - Security-relevant ambiguity should never be auto-healed by guesswork.
    - Retry is acceptable only when it preserves fail-closed semantics.
alternatives:
  - name: Fail closed on key-resolution uncertainty
    description: Reject or mark indeterminate whenever trusted key resolution is not crisp.
    pros:
      - Prevents accidental trust escalation.
      - Keeps cache and refresh logic subordinate to security policy.
    cons:
      - Some transient outages cause hard failures.
    estimated_cost: medium
    risk: low
  - name: Best-effort acceptance
    description: Try alternate keys or stale cache entries until something verifies.
    pros:
      - Potentially fewer availability failures.
    cons:
      - Harder to reason about.
      - Risks accepting the wrong trust path.
    estimated_cost: high
    risk: medium
    rejection_rationale: Availability cannot outrank trust clarity in a
      security-focused reference bundle.
decision:
  chosen_alternative: Fail closed on key-resolution uncertainty
  rationale: >
    Missing keys, ambiguous key matches, stale remote material that cannot be
    refreshed,

    and issuer-binding failures all resolve to rejection or indeterminate trust.
    The

    validator never guesses a key and never silently accepts stale uncertainty.
  tradeoffs: >-
    The team accepts the following tradeoffs:


    - Remote profiles intentionally prefer secure failure over graceful
    degradation.
  decision_date: 2024-09-25
  confidence: high
consequences:
  positive:
    - "`kid` ambiguity and remote refresh failures have a principled outcome."
    - Strategy-specific retry behavior remains bounded.
  negative:
    - Remote profiles intentionally prefer secure failure over graceful
      degradation.
confirmation:
