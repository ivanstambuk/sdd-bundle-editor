id: RULE-KID-AMBIGUITY
kind: ValidationRule
title: "Verify Unambiguous Key Resolution"
description: If a `kid` maps to multiple matching keys within the given key material, the validator MUST treat the outcome as indeterminate rather than guessing.
tags: [validation, crypto]
severity: FATAL
throwsErrorCodeId: ERR-kid-ambiguous
implementsConstraintIds: []
