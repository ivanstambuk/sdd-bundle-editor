id: SCN-password-reset
title: End-to-End Login and Session Validation
viewpoint: e2e-test
intent: Full integration test covering login, session creation, and authenticated
  API call
preconditions:
- Test environment is initialized
- Test user fixtures are loaded
- All services are healthy
postconditions:
- User can make authenticated requests
- Session persists across requests
steps:
- order: 1
  actorId: ACT-end-user
  action: Submit login request
  componentId: COMP-data-store
- order: 2
  componentId: COMP-api-gateway
  action: Authenticate and return tokens
  expectedResponse:
    status: 200
- order: 3
  actorId: ACT-end-user
  action: Access protected resource with token
  componentId: COMP-data-store
- order: 4
  componentId: COMP-api-gateway
  action: Validate JWT token
- order: 5
  componentId: COMP-auth-service
  action: Return protected resource
  expectedResponse:
    status: 200
tags:
- e2e
- integration
- critical-path
