id: PROF-TURBOSHAKE-K12-RFC9861
kind: CryptoProfile
title: TurboSHAKE / KangarooTwelve / HopMAC RFC 9861 Profile
description: |
  This bundle captures the normative profile surface for TurboSHAKE128/256,
  KangarooTwelve KT128/KT256, HopMAC128/256, the TurboSHAKE streaming context,
  and the helper `length_encode`.
scope: |
  This profile narrows RFC 9861 for interoperable implementations. It fixes
  parameter bounds, error semantics, streaming contracts, and HopMAC policies
  while preserving the underlying TurboSHAKE and KangarooTwelve constructions.
executionStatus: active
artifactClass: contract
lifecycleStatus: active
version: 1.0.0
normativeReferenceIds:
  - RFC-9861
  - FIPS-202
  - REF-KECCAK-TURBOSHAKE
  - REF-KECCAK-RFC9861
  - DRAFT-K12-10
supportedPrimitiveIds:
  - PRIM-kp
  - PRIM-turboshake128
  - PRIM-turboshake256
  - PRIM-turboshake-context
  - PRIM-kt128
  - PRIM-kt256
  - PRIM-hopmac128
  - PRIM-hopmac256
  - PRIM-length-encode
conformanceClassIds:
  - CLASS-kp
  - CLASS-turboshake-core
  - CLASS-k12-core
  - CLASS-hopmac-profile
conformanceSuiteIds:
  - SUITE-rfc9861-turboshake
  - SUITE-rfc9861-k12
  - SUITE-local-hopmac
bundleNotes: |
  This bundle focuses on the normative profile contract, conformance structure,
  and test-vector coverage needed for implementation and review.

  RFC vector suites are stored as grouped concrete test-vector entities with
  bundled expected outputs for the currently active conformance cases.
  Public TurboSHAKE conformance excludes the KT-reserved domain values and
  models them as explicit rejection coverage instead.

  Confirmed local HopMAC vectors are stored as concrete entries.
