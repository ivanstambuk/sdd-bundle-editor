id: KEY-static-jwks
kind: KeyStrategy
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Static In-Memory JWKS
description: A key resolution strategy that looks up keys (`kid`) from a
  hardcoded JSON Web Key Set provided at invocation time.
rationale: Essential for unit testing and offline edge environments without
  network access.
tags:
  - resolution
  - offline
strategyType: STATIC
cacheBehavior: NO-CACHE
trustSourceType: INVOKER-PROVIDED
refreshStrategy: never
staleKeyBehavior: reject
rolloverBehavior: manual-only
networkFailureBehavior: fail-closed
issuerBindingMode: none
implementationNotes: |
  For generated phase-1 bindings, invoker-provided static key material should be
  passed through `validationContext.trustedJwks`. Conformance fixtures with
  `fixtureMode: static-keyset` should map their `jwks` payload into that field
  without renaming it.
governedByAdrIds:
  - ADR-0004-static-jwks-as-baseline-trust-source
