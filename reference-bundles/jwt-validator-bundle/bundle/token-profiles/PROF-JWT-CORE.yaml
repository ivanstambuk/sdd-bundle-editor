id: PROF-JWT-CORE
kind: TokenProfile
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Basic JWT Validator Core
description: Local stateless baseline for securely parsing, authenticating, and then validating a signed compact JWT using caller-supplied trusted key material.
profileType: Custom
profileFamily: JWT-CORE
replayProtectionMode: out-of-scope
implementsReferenceIds:
  - RFC-7515
  - RFC-7518
  - RFC-7519
  - RFC-8725
acceptsPolicyId: STRUCT-runtime-policy
acceptsContextId: STRUCT-validation-context
returnsModelId: STRUCT-validation-result
unsupportedFormatIds:
  - FMT-jwe-compact
  - FMT-jws-json
  - FMT-nested-jwt
allowsAlgorithmIds:
  - ALG-HS256
  - ALG-RS256
  - ALG-ES256
  - ALG-PS256
requiresHeaderIds:
  - HDR-alg
requiresClaimIds:
  - CLAIM-exp
optionalClaimIds:
  - CLAIM-aud
  - CLAIM-iss
  - CLAIM-iat
  - CLAIM-jti
  - CLAIM-sub
definesPipelineStepIds:
  - STEP-1
  - STEP-2
  - STEP-3
  - STEP-4
usesFormatId: FMT-jws-compact
usesKeyStrategyIds:
  - KEY-static-jwks
governedByAdrIds:
  - ADR-profile-driven-validator-composition
  - ADR-compact-jws-only-v1
  - ADR-static-jwks-as-baseline-trust-source
  - ADR-profile-governs-claim-requirements

optionalHeaderIds:
  - HDR-kid
  - HDR-typ
  - HDR-cty
  - HDR-crit
  - HDR-jku
  - HDR-jwk
  - HDR-x5u
  - HDR-x5c
  - HDR-x5t
  - HDR-x5t-s256
