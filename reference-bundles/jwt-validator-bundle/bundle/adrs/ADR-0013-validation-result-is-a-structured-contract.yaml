adr:
  id: ADR-0013-validation-result-is-a-structured-contract
  title: Return a structured validation result instead of a boolean or prose error
  y_statement: >-
    **In the context of** The validator serves both application callers and a
    conformance harness. Those users

    need more than pass/fail: they need to know which profile was evaluated,
    where

    failure occurred, and whether trust ended in rejection, malformed input, or

    indeterminate state. **facing** What should the primary contract of the
    validate operation look like? **we decided for** Structured result contract
    **and neglected** Boolean plus free-form message **to achieve** Applications
    and conformance tooling can consume the same output model.; Diagnostics
    remain testable without log scraping. **accepting** The result structure is
    more detailed than a minimal validator API. **because** `OP-validate-jwt`
    returns a structured `STRUCT-validation-result` document capturing

    outcome class, selected profile, key-selection status, trust decision,
    terminal step,

    failed rule, and structured diagnostics.
  status: accepted
  created_at: 2024-10-08T09:00:00Z
  last_modified: 2024-10-09T11:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Validation Result API
  tags:
    - api
    - result
    - contract
  priority: medium
  decision_type: technology
  decision_level: tactical
