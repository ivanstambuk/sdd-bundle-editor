id: RULE-KID-RESOLVE
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Resolve Public Key via KID
description: The validator MUST extract the `kid` from the header and resolve it
  to exactly one verified public key in the trusted JWKS.
tags:
  - validation
  - crypto
severity: FATAL
precedenceWithinStep: 40
throwsErrorCodeId: ERR-kid-not-found
failureProjection:
  trustDecision: indeterminate
  keySelectionStatus: missing
implementsReferenceIds:
  - RFC-7515
