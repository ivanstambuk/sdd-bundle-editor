id: VEC-jwt-duplicate-keys
kind: TestVector
title: "Duplicate JSON Keys Exists"
description: A structurally malformed token that attempts to exploit JSON parsers by declaring the `sub` claim twice in the payload to bypass downstream checks while passing signature checks.
tags: [test, parse, security]
payloadJson: '{"sub": "admin", "sub": "user"}'
expectsErrorCodeIds: [ERR-malformed]
validatesRuleIds: [RULE-NO-DUPLICATE-KEYS]
