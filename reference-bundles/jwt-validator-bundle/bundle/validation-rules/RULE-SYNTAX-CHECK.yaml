id: RULE-SYNTAX-CHECK
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Verify Compact Serialization Syntax
description: The validator MUST ensure the input string contains exactly three
  parts delimited by periods, and that all parts are valid Base64url-encoded
  strings.
tags:
  - validation
  - parse
severity: FATAL
precedenceWithinStep: 10
throwsErrorCodeId: ERR-malformed
failureProjection:
  trustDecision: rejected
  keySelectionStatus: not-applicable
implementsReferenceIds:
  - RFC-7515
implementsConstraintIds:
  - CON-safe-diagnostics
implementationHints:
  - Stop malformed raw input here when compact syntax or base64url decoding fails.
  - Do not let downstream duplicate-key diagnostics override a syntax failure.
