  "excerpt": "3.6 Establish Consent on User Parameters Access In this section, the Establish Consent on User Parameters Access is defined for the openFinance API Framework. User parameters are user related technical access data which is needed for the API Client so steer the user frontend e.g. for authorisation processes. This data is specifically addressing use cases for direct access of the API by API client software.",
