  "statement": "3.1.4 Redirect SCA Approach: Implicit Start of the Authorisation Process with Confirmation Code In addition to the scenario above, an authorisation confirmation request might be requested by the ASPSP from the TPP after the session is re-redirected to the TPP\u2019s system and after the TPP's control on session fixation. In the end, a payment status request might be needed by the TPP to control the exact status of the payment initiation. PSU PISP ASPSP PSU initiates a payment via a TPP 1. Payment-Initiation Request validate \u2022 eIDAS certificate \u2022 request syntax \u2022 tpp role 2a.",
