adr:
  id: ADR-0003-parse-before-trust-pipeline
  title: Parse and harden the token envelope before any trust decision
  y_statement: >-
    **In the context of** Several failure modes happen before cryptography is
    even relevant: malformed compact

    structure, duplicate JSON keys, and unsupported container types. The bundle
    already

    models parsing as its own operation and the first pipeline step as a hard
    boundary. **facing** When should low-level parse and structure checks run
    relative to key resolution and

    signature verification? **we decided for** Parse before trust **and
    neglected** Fold parsing into signature verification **to achieve** The
    parser operation and Step 1 have a crisp purpose.; Negative vectors for
    malformed input stay easy to reason about. **accepting** Implementations
    need a small amount of pre-crypto parsing infrastructure. **because** Treat
    parsing and envelope hardening as the first stage of validation. The
    validator

    must reject malformed compact input, duplicate JSON keys, and unsupported
    container

    shapes before it considers keys, signatures, or claim policy.
  status: accepted
  created_at: 2024-09-09T09:00:00Z
  last_modified: 2024-09-10T12:00:00Z
  version: "1.0"
  schema_version: 1.0.0
