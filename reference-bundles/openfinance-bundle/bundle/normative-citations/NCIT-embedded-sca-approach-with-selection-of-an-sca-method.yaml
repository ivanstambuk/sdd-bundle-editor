  "excerpt": "3.1.10 Embedded SCA Approach with Selection of an SCA method In the following flow, there is a selection of an SCA method added in case of the ASPSP supporting several SCA methods for the corresponding PSU. The ASPSP transmits first the openFinance PSD2 XSZA API \u2013 Implementation Guidelines Payment Initiation Service available methods to the PISP. The PISP might filter them, if not all authentication methods can be technically supported. The available methods then are presented to the PSU for choice.",
