id: RULE-KID-AMBIGUITY
kind: ValidationRule
executionStatus: active
artifactClass: contract
lifecycleStatus: active
title: Verify Unambiguous Key Resolution
description: If a `kid` maps to multiple matching keys within the given key
  material, the validator MUST treat the outcome as indeterminate rather than
  guessing.
tags:
  - validation
  - crypto
severity: FATAL
precedenceWithinStep: 50
throwsErrorCodeId: ERR-kid-ambiguous
failureProjection:
  trustDecision: indeterminate
  keySelectionStatus: ambiguous
governedByAdrIds:
  - ADR-0008-key-resolution-fails-closed
