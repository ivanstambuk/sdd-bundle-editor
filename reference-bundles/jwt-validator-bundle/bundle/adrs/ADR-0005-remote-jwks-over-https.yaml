adr:
  id: ADR-0005-remote-jwks-over-https
  title: Resolve remote keys only from explicitly configured HTTPS JWKS endpoints
  y_statement: >-
    **In the context of** Many JWT deployments rely on remote key rotation, but
    a reference bundle should make

    the trust boundary explicit. Remote resolution needs transport guarantees,
    bounded

    caching, and a clear owner for endpoint configuration. **facing** How should
    the remote-JWKS profile acquire signing keys without allowing the token

    itself to dictate trust-sensitive network behavior? **we decided for**
    Configured HTTPS JWKS endpoint **and neglected** Header-driven remote key
    endpoints **to achieve** The remote profile models realistic deployment
    behavior without blurring trust roots.; TLS and cache expectations become
    first-class artifacts. **accepting** Implementations need cache, refresh,
    and retry behavior. **because** Remote JWKS resolution is supported only via
    explicitly configured HTTPS endpoints.

    The strategy may cache and refresh, but the trust root is the configured URI
    plus

    validated transport, not any signer-controlled header.
  status: accepted
  created_at: 2024-09-13T09:00:00Z
  last_modified: 2024-09-16T10:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Remote Key Resolution
  tags:
    - jwks
    - network
    - tls
  priority: high
  decision_type: security
  decision_level: operational
