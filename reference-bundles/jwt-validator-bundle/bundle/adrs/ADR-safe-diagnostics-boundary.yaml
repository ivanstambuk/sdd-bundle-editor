id: ADR-safe-diagnostics-boundary
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Keep diagnostics explicit without treating unverified claims as trusted data
status: accepted
createdDate: '2024-10-04T09:00:00Z'
decidedDate: '2024-10-07T10:00:00Z'
lastModifiedDate: '2024-10-07T10:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  Operators want useful diagnostics when validation fails, but returning parsed claims
  as if they were trustworthy can cause downstream misuse. The bundle already models a
  diagnostic outcome class and a constraint on claims visibility during failures.
problem: |
  How much structured detail should the validator return on failure?
assumptions:
  - Consumers benefit from structured diagnostics.
  - Claims extracted from failed tokens are not trustworthy by default.
decision: |
  Return structured diagnostics about steps, rules, and error codes, but do not treat
  unverified claims as trustworthy output unless runtime policy explicitly opts into a
  diagnostic-only path.
alternativesConsidered:
  - name: Structured diagnostics with a trust boundary
    description: Keep failure reporting rich while preserving trust semantics.
    pros:
      - Useful for debugging and conformance.
      - Avoids accidental trust escalation.
    cons:
      - Requires consumers to understand diagnostic vs trusted outcomes.
    isChosen: true
  - name: Return parsed claims freely on failure
    description: Always include whatever claims could be parsed.
    pros:
      - Easier debugging.
    cons:
      - Risks downstream misuse of untrusted data.
    reasonRejected: It blurs the most important security boundary in the validator.
positiveConsequences:
  - Failure reports remain actionable.
  - The bundle can distinguish rejected, malformed, indeterminate, and diagnostic outcomes.
negativeConsequences:
  - Some operators may need an explicit policy flag for deeper failure introspection.
relatedRuleIds:
  - RULE-COMPACT-JWS-ONLY
relatedConstraintIds:
  - CON-safe-diagnostics
relatedDataStructureIds:
  - STRUCT-validation-result
tags:
  - diagnostics
  - boundary
  - trust
