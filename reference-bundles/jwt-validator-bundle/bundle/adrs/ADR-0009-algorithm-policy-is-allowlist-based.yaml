context:
  description: >-
    JWT validation failures often come from treating algorithm identifiers as
    advisory

    rather than policy. The bundle already includes algorithm entities,
    minimum-strength

    constraints, and a prohibition on `none`.


    ## Decision Question


    How should the validator decide whether an advertised algorithm is
    acceptable?
  assumptions:
    - Accepting whatever the token advertises is unsafe.
    - Key material and declared algorithm must agree.
alternatives:
  - name: Explicit allowlist with compatibility checks
    description: Validate `alg` against profile policy and the selected key.
    pros:
      - Makes crypto policy auditable.
      - Keeps algorithm confusion attacks in scope.
    cons:
      - Profiles must maintain explicit algorithm lists.
    estimated_cost: medium
    risk: low
  - name: Accept any algorithm supported by the runtime library
    description: Defer crypto policy to implementation defaults.
    pros:
      - Less bundle configuration.
    cons:
      - Runtime defaults vary.
      - Harder to prove conformance.
    estimated_cost: high
    risk: medium
    rejection_rationale: The reference bundle must state algorithm policy, not
      inherit it implicitly from whichever crypto library happens to be in use.
decision:
  chosen_alternative: Explicit allowlist with compatibility checks
  rationale: >
    Algorithm policy is allowlist based. Profiles declare acceptable algorithms,
    `none`

    remains forbidden, key-algorithm compatibility is checked explicitly, and
    weak key

    material remains rejectable even if it technically verifies.
  tradeoffs: |-
    The team accepts the following tradeoffs:

    - Algorithm onboarding requires schema and fixture updates.
  decision_date: 2024-09-27
  confidence: high
consequences:
  positive:
    - Crypto policy is visible in profiles and rules.
    - Weak keys and `none` are rejected for principled reasons.
  negative:
    - Algorithm onboarding requires schema and fixture updates.
confirmation:
  description: >-
    Implementation is confirmed by the linked bundle artifacts
    (RULE-ALG-ALLOWLIST, RULE-KEY-ALG-MATCH, CON-no-none-alg,
    CON-min-key-strength, CON-timing-attack, RFC-7518, RFC-8725) and by strict
    JWT bundle validation.


    Validation evidence should include bundle validation plus the conformance
    suites or rules that exercise this decision boundary.
  artifact_ids:
    - RULE-ALG-ALLOWLIST
    - RULE-KEY-ALG-MATCH
    - CON-no-none-alg
    - CON-min-key-strength
    - CON-timing-attack
    - RFC-7518
    - RFC-8725
