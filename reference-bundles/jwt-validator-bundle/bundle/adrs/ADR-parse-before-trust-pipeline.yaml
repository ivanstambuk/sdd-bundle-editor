id: ADR-parse-before-trust-pipeline
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Parse and harden the token envelope before any trust decision
status: accepted
createdDate: '2024-09-09T09:00:00Z'
decidedDate: '2024-09-10T12:00:00Z'
lastModifiedDate: '2024-09-10T12:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  Several failure modes happen before cryptography is even relevant: malformed compact
  structure, duplicate JSON keys, and unsupported container types. The bundle already
  models parsing as its own operation and the first pipeline step as a hard boundary.
problem: |
  When should low-level parse and structure checks run relative to key resolution and
  signature verification?
assumptions:
  - Rejecting malformed input early reduces exploit surface.
  - Structure checks should not depend on network or trust context.
decision: |
  Treat parsing and envelope hardening as the first stage of validation. The validator
  must reject malformed compact input, duplicate JSON keys, and unsupported container
  shapes before it considers keys, signatures, or claim policy.
alternativesConsidered:
  - name: Parse before trust
    description: Stage the pipeline so malformed input fails before trust-sensitive work.
    pros:
      - Shrinks attack surface.
      - Produces deterministic early failures.
      - Aligns with explicit validation steps in the bundle.
    cons:
      - Requires a dedicated parsing boundary in the model.
    isChosen: true
  - name: Fold parsing into signature verification
    description: Let downstream verification stages absorb malformed-input handling.
    pros:
      - Fewer conceptual stages.
    cons:
      - Mixes syntax failures with trust failures.
      - Makes error reporting less precise.
    reasonRejected: The bundle benefits from a clean separation between malformed input
      and failed trust decisions.
positiveConsequences:
  - The parser operation and Step 1 have a crisp purpose.
  - Negative vectors for malformed input stay easy to reason about.
negativeConsequences:
  - Implementations need a small amount of pre-crypto parsing infrastructure.
relatedOperationIds:
  - OP-parse-jwt
  - OP-validate-jwt
relatedRuleIds:
  - RULE-SYNTAX-CHECK
  - RULE-COMPACT-JWS-ONLY
  - RULE-NO-DUPLICATE-KEYS
relatedFormatIds:
