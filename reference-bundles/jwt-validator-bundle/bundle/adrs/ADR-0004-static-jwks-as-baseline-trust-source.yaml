adr:
  id: ADR-0004-static-jwks-as-baseline-trust-source
  title: Use invoker-supplied static JWKS as the baseline trust source
  y_statement: >-
    **In the context of** The bundle needs a minimal validator mode that works
    offline, supports deterministic

    tests, and avoids network trust concerns. That baseline mode becomes the
    foundation

    that richer remote profiles extend. **facing** What trust source should
    define the smallest secure validator profile? **we decided for** Static JWKS
    baseline **and neglected** Remote JWKS as the default baseline **to
    achieve** The core profile stays simple and reproducible.; Remote trust
    behavior can be layered on top as explicit extensions. **accepting**
    Production-like rollover is not part of the core profile. **because** The
    baseline profile uses invoker-supplied static JWKS as its only trust source.

    Key rollover is manual, there is no cache, and network behavior is
    intentionally out

    of scope for the core profile.
  status: accepted
  created_at: 2024-09-11T09:00:00Z
  last_modified: 2024-09-12T11:00:00Z
  version: "1.0"
  schema_version: 1.0.0
  project: JWT Validator Reference Bundle
  component: Core Trust Source
  tags:
    - trust
    - jwks
    - baseline
  priority: high
  decision_type: security
  decision_level: tactical
