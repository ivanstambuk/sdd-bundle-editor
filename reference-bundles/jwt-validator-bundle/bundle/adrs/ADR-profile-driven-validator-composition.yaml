id: ADR-profile-driven-validator-composition
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Model the validator as composable profiles, strategies, rules, and suites
status: accepted
createdDate: '2024-09-02T09:00:00Z'
decidedDate: '2024-09-05T14:00:00Z'
lastModifiedDate: '2024-09-05T14:00:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  The reference bundle needs to describe more than one validator shape. It covers a
  local static-key validator, a remote JWKS validator, and an OIDC discovery variant.
  The same bundle also needs to capture operations, constraints, conformance classes,
  suites, and fixtures without duplicating large trees of nearly identical entities.
problem: |
  How do we represent validator variants and their shared logic without creating a
  separate bundle for every deployment mode or flattening everything into one giant
  profile that loses architectural boundaries?
assumptions:
  - Most validator variants share the same parsing and claim-validation pipeline.
  - Key resolution strategy is the main point of behavioral variation.
  - Conformance should be traceable back to explicit bundle entities.
decision: |
  Model the validator as a composition of:

  - token profiles for externally visible capability sets
  - key strategies for trust-source behavior
  - validation rules and steps for execution semantics
  - conformance classes and suites for executable acceptance criteria

  Profiles can inherit and narrow behavior rather than fork entire entity sets.
alternativesConsidered:
  - name: Composable profile model
    description: Separate reusable entities with profile inheritance and explicit traceability.
    pros:
      - Avoids duplication between core, remote JWKS, and OIDC variants.
      - Keeps trust strategy concerns separate from claim policy concerns.
      - Makes conformance artifacts first-class entities instead of comments.
    cons:
      - Requires more entity types and cross-links.
    isChosen: true
  - name: One monolithic validator profile
    description: Model all behavior in a single profile with many optional branches.
    pros:
      - Fewer top-level documents.
    cons:
      - Makes capability boundaries ambiguous.
      - Encourages undocumented optional behavior.
    reasonRejected: It would hide the architectural differences that the reference bundle
      is meant to make explicit.
positiveConsequences:
  - The bundle can describe product-line style variation without duplication.
  - Traceability can point from rules, suites, and operations to concrete decisions.
negativeConsequences:
  - The ontology is denser and requires more cross-reference discipline.
neutralConsequences:
  - Readers need to understand inheritance and composition to navigate the model well.
