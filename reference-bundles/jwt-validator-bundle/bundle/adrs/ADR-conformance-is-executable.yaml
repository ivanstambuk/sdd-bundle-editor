id: ADR-conformance-is-executable
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Represent conformance as executable classes, suites, vectors, and fixtures
status: accepted
createdDate: '2024-10-10T09:00:00Z'
decidedDate: '2024-10-11T10:30:00Z'
lastModifiedDate: '2024-10-11T10:30:00Z'
lastModifiedBy: ACT-sec-team
confidence: high
deciderActorIds:
  - ACT-sec-team
context: |
  A validator bundle is much more useful if acceptance criteria can be executed rather
  than merely described. The JWT reference bundle already contains classes, suites,
  vectors, mock key sets, and an audit operation.
problem: |
  How should the bundle express what it means for an implementation to conform?
assumptions:
  - Conformance needs to be reproducible, not just documented.
  - Variants like remote JWKS and OIDC require different executable evidence.
decision: |
  Model conformance as first-class executable artifacts: classes declare capability
  boundaries, suites group vectors and fixtures, and the audit operation produces a
  structured report. This keeps validation behavior and acceptance behavior in the same
  ontology.
alternativesConsidered:
  - name: Executable conformance artifacts
    description: Put classes, suites, vectors, fixtures, and audit reports in the bundle.
    pros:
      - Conformance can be automated.
      - Profile-specific expectations remain explicit.
    cons:
      - The bundle contains more than pure domain rules.
    isChosen: true
  - name: Narrative compliance checklist
    description: Describe conformance in prose or markdown only.
    pros:
      - Less modeling overhead.
    cons:
      - Harder to automate and keep current.
    reasonRejected: The reference bundle is most valuable when it can drive real
      automated audits.
positiveConsequences:
  - Acceptance criteria can evolve alongside rules and profiles.
  - Security regressions become easier to catch with concrete vectors.
negativeConsequences:
  - Fixtures and suites require ongoing curation.
relatedOperationIds:
  - OP-run-conformance-audit
relatedClassIds:
