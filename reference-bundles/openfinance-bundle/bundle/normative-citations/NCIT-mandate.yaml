  "excerpt": "3.4.4 Initiation for Standing Orders for Recurring/Periodic Payments The recurring payments initiation function will be covered in this specification as a specific standing order initiation: The TPP can submit a recurring payment initiation where the starting date, frequency and conditionally an end date is provided. Once authorised by the PSU, the payment then will be executed by the ASPSP, if possible, following this \"standing order\" as submitted by the TPP. No further TPP action is needed.",
