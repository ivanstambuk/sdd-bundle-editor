  "statement": "3.1.9 Embedded SCA Approach with only one SCA method available In case where only one SCA method is available, the \"Authorise Transaction Request\" is added to the flow, where the TPP is transmitting the authentication data of the customer, e.g. an OTP with included dynamic linking to the transaction details. PSU PISP ASPSP PSU initiates a payment via a TPP 1. Payment-Initiation Request validate \u2022 eIDAS certificate \u2022 request syntax \u2022 tpp role 2a. Payment-Initiation Response (NOK) \u2022 semantics END http Codes: 401, 400, 403 2b.",
