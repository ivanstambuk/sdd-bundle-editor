id: ADR-0001
kind: ADR
executionStatus: active
artifactClass: documentation
lifecycleStatus: active
title: Support Only JWS Compact Serialization
description: We will only implement JWS Compact serialization (dots separating base64 segments) in the initial v1 code generator.
rationale: General JSON serialization is too complex and rarely used in standard OIDC flows. JWS Compact covers 99% of web implementations.
tags:
  - scope-limit
  - v1-feature
status: Accepted
