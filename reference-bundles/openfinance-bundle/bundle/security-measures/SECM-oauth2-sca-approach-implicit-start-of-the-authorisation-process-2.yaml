  "statement": "3.1.2 OAuth2 SCA Approach: Implicit Start of the Authorisation Process If the ASPSP supports the OAuth2 SCA Approach, the flow is very similar to the Redirect SCA Approach. Instead of redirecting the PSU directly to an authentication server, the OAuth2 Consent API Establish Consents Messages protocol is used for the transaction authorisation process. In the following, a flow is shown, where the Authorisation Process in the NextGenPSD2 API has been implicitly started. PSU AISP ASPSP PSU initiates an account information access via a TPP 1.",
