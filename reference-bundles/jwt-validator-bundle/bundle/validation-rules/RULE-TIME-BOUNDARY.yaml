id: RULE-TIME-BOUNDARY-CHECK
kind: ValidationRule
title: "Strict Time Boundary Evaluation"
description: The validator MUST process boundary conditions exactly according to the injected `now_epoch_seconds`. (e.g. if `exp` == `now`, it is expired. If `nbf` == `now`, it is valid).
tags: [validation, time, boundary]
severity: ERROR
throwsErrorCodeId: ERR-expired
implementsReferenceIds: [RFC-7519]
implementsConstraintIds: [CON-clock-skew]
